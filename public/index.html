<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreciseCV </title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="./js/workReference.js" defer></script>
    <script src="./js/education.js" defer></script>
    <script src="./js/workExperience.js" defer></script>
    <script src="./js/skills.js" defer></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 flex">
        <!-- Form Section -->
        <div class="w-1/2 pr-4">
            <h1 class="text-2xl font-semibold mb-4"><u>PreciseCV Maker</u></h1>
            
            <!-- ... (keep your existing form content) ... -->

        </div>

        <!-- Preview Section -->
        <div class="w-1/2 pl-4">
            <h2 class="text-2xl font-semibold mb-4"><u>CV Preview</u></h2>
            <div id="preview" class="preview-section">
                <h2>Personal Details</h2>
                <p><strong>Name:</strong> <span id="preview-name"></span></p>
                <p><strong>Email:</strong> <span id="preview-email"></span></p>
                <p><strong>Address:</strong> <span id="preview-address"></span></p>
                <p><strong>Phone:</strong> <span id="preview-phone"></span></p>
                <p><strong>Date of Birth:</strong> <span id="preview-dob"></span></p>
                <p><strong>Gender:</strong> <span id="preview-gender"></span></p>
                <p><strong>Marital Status:</strong> <span id="preview-marital-status"></span></p>

                <h2>Education</h2>
                <div id="preview-education"></div>

                <h2>Work Experience</h2>
                <div id="preview-work-experience"></div>

                <h2>Work Reference</h2>
                <div id="preview-work-reference"></div>

                <h2>Skills</h2>
                <ul id="preview-skills"></ul>
            </div>
        </div>
    </div>

    <script>
        // ... (keep your existing JavaScript) ...

        // Function to update preview
        function updatePreview() {
            const formData = collectFormData();
            
            // Update personal details
            document.getElementById('preview-name').textContent = formData.personalDetails.name;
            document.getElementById('preview-email').textContent = formData.personalDetails.email;
            document.getElementById('preview-address').textContent = formData.personalDetails.address;
            document.getElementById('preview-phone').textContent = formData.personalDetails.phone;
            document.getElementById('preview-dob').textContent = formData.personalDetails.dateOfBirth;
            document.getElementById('preview-gender').textContent = formData.personalDetails.gender;
            document.getElementById('preview-marital-status').textContent = formData.personalDetails.maritalStatus;

            // Update education
            const educationPreview = document.getElementById('preview-education');
            educationPreview.innerHTML = formData.education.map(edu => `
                <div>
                    <p><strong>${edu.school}</strong> - ${edu.level}</p>
                    <p>${edu.duration}</p>
                </div>
            `).join('');

            // Update work experience
            const workExperiencePreview = document.getElementById('preview-work-experience');
            workExperiencePreview.innerHTML = formData.workExperience.map(exp => `
                <div>
                    <p><strong>${exp.position}</strong> at ${exp.company}</p>
                    <p>${exp.duration}</p>
                    <p>${exp.responsibility}</p>
                </div>
            `).join('');
          
            const workReferencePreview = document.getElementById('preview-work-reference');
            workReferencePreview.innerHTML = formData.workReference.map(ref => `
                <div>
                    <p><strong>${ref.position}</strong> at ${ref.company}</p>
                    <p>${ref.duration}</p>
                    <p>Contact: ${ref.contactName} ${ref.contactSurname}</p>
                    <p>Email: ${ref.contactEmail}, Phone: ${ref.contactPhone}</p>
                </div>
            `).join('');

            // Update skills
            const skillsPreview = document.getElementById('preview-skills');
            skillsPreview.innerHTML = formData.skills.map(skill => `<li>${skill}</li>`).join('');
        }

        // Add event listeners to all input fields
        document.querySelectorAll('input, select, textarea').forEach(field => {
            field.addEventListener('input', updatePreview);
        });

       
        document.getElementById('addEducation').addEventListener('click', () => setTimeout(updatePreview, 0));
        document.getElementById('addExperience').addEventListener('click', () => setTimeout(updatePreview, 0));
        document.getElementById('addPosition').addEventListener('click', () => setTimeout(updatePreview, 0));
        document.getElementById('addSkill').addEventListener('click', () => setTimeout(updatePreview, 0));

            // Collect work reference data
            const referenceItems = document.querySelectorAll('.work-reference');
            referenceItems.forEach((item) => {
                formData.workReference.push({
                    position: item.querySelector('.position').value,
                    company: item.querySelector('.company').value,
                    duration: item.querySelector('.duration').value,
                    contactName: item.querySelector('.contact-name').value,
                    contactSurname: item.querySelector('.contact-surname').value,
                    contactEmail: item.querySelector('.contact-email').value,
                    contactPhone: item.querySelector('.contact-phone').value,
                    contactPosition: item.querySelector('.contact-position').value
                });
            });

            // Collect skills data
            const skillInputs = document.querySelectorAll('.skill');
            skillInputs.forEach((input) => {
                formData.skills.push(input.value);
            });

            return formData;
        }

        // Function to send form data to backend
        function sendData(formData) {
    fetch('/generate-cv', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.blob(); // Change to blob() instead of json()
    })
    .then(blob => {
        // Create a URL for the blob
        const url = window.URL.createObjectURL(blob);
        // Create a temporary link element
        const a = document.createElement('a');
        a.href = url;
        // Set the download filename
        a.download = `${formData.personalDetails.name.toLowerCase().replace(/\s+/g, '_')}.pdf`;
        // Append to body, click, and remove
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();
    })
    .catch(error => {
        console.error('Error:', error);
        // Add better error handling here, perhaps show an error message to the user
        alert('Failed to generate CV. Please try again.');
    });
}

        // Event listener for submit button click
        document.getElementById('save').addEventListener('click', function() {
            const formData = collectFormData();
            sendData(formData);
        });
    </script>
</body>
</html>
